<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div>
        <div class=" content" style="border-radius: 30px;  width: 80%; margin-left:60px ;">
            <p>
            <h1><b style="margin-left: 200px; font-family:cursive">LOGIN</b></h1>
            </p>
            <div>
                <b style="color:rgb(35, 34, 53); margin-left:20px">If you already have
                    an account here.
                </b>
            </div>

            <div class="login-mode" ;>
                <div class="typo-name" style="display:flex">
                    <div class="name-content"><b style="color: #0f0803;"> EMAIL/USERNAME/TEL:</b></div>
                    <div>

                        <input type="text" class="class" placeholder="the one you registered with"
                            style="width: 400px; height: 20px; margin-left: 12px;"></input>
                    </div>
                    <style>
                        input::placeholder {
                            color: #8a8a8a;
                            /*soft gray but not harsh*/
                            font-family: 'inter', sans-serif;
                            font-size: 14px;
                            letter-spacing: 0.3px;
                            font-weight: 400;
                            text-transform: lowercase;
                            opacity: 0.8;
                        }

                        input:focus::placeholder {
                            color: #b0b0b0;
                            transition: 0.3s ease;
                        }

                        input {
                            background: #f8F8F8;
                            border: 1px solid #e5e5e5;
                            border-radius: 12px;
                            padding: 12px 16px;
                            font-family: 'Inter', sans-serif;
                        }

                        .main-content {
                            width: 80%;
                            border-radius: 12px;
                        }
                    </style>
                </div>
                <div class="typo-age;" style="display:flex">
                    <div class="text" style="margin-top:30px;"><b style="color: #0f0803; ;">AGE:</div>
                    <input type="text" class="class" placeholder="18 and above"
                        style="width: 400px; height: 20px; margin-top:30px; margin-left:161px; ">
                    </input>
                </div>

                <div class="typo-email" style="display:flex; margin-top: 20px">
                    <div class="text">PASSWORD:</div><input type="email" class="class"
                        placeholder="........................hdqf"
                        style="width:400px; height: 20px; margin-left: 105px;">
                </div>
                </input>

                <button type="submit"
                    style="background-color: rgb(22, 54, 73); color:aliceblue; width:80px; height:27px; margin-top: 70px; margin-right: 800px;">LOGIN</button>

            </div>
        </div>
    </div>
</body>

</html>
